
services:
  postgres:
    image: postgres:17
    container_name: projectflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectflow_user
      POSTGRES_PASSWORD: projectflow_password
      POSTGRES_DB: projectflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectflow_user -d projectflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
