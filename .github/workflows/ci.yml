
name: ProjectFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: projectflow_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: projectflow_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectflow_user -d projectflow_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://projectflow_user:test_password@localhost:5432/projectflow_test_db
          TEST_DATABASE_URL: postgresql+psycopg://projectflow_user:test_password@localhost:5432/projectflow_test_db
          SECRET_KEY: test-secret-key-for-github-actions-ci-only
          ENVIRONMENT: testing
          REDIS_URL: redis://localhost:6379/0
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://projectflow_user:test_password@localhost:5432/projectflow_test_db
          TEST_DATABASE_URL: postgresql+psycopg://projectflow_user:test_password@localhost:5432/projectflow_test_db
          SECRET_KEY: test-secret-key-for-github-actions-ci-only
          ENVIRONMENT: testing
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v
